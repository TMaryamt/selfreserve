{% extends 'accounts/base.html' %} {% load static %} {% block content %}
<style>
  @import url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css");

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    font-family: "Vazirmatn", sans-serif;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    min-height: 100%;
    margin: 0;
    padding: 0;
    background-color: #0f172a; /* فقط روی دسکتاپ دیده می‌شود */
  }

  /* ---------- قاب اصلی ---------- */
  /* روی موبایل: تمام صفحه، بدون حاشیه */
  .mobile-container {
    width: 100%;
    max-width: 440px;
    min-height: 100vh; /* fallback */
    min-height: 100dvh; /* ارتفاع واقعی بدون نوار آدرس مرورگر */
    margin: 0 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    direction: rtl;
    overflow: hidden;
    background: url("{% static 'images/campus.png' %}") center bottom / cover
      no-repeat;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* روی دسکتاپ/تبلت: شبیه قاب گوشی */
  @media (min-width: 500px) {
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .mobile-container {
      min-height: min(100dvh, 915px);
      border-radius: 28px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
    }
  }

  /* ---------- هدر ---------- */
  .header-wrapper {
    position: relative;
    width: 100%;
    flex-shrink: 0;
    margin-bottom: 28px;
  }

  .header-halo-curve {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% + 25px);
    background-color: rgba(220, 238, 253, 0.92);
    border-bottom-left-radius: 50% 68px;
    border-bottom-right-radius: 50% 68px;
    box-shadow: 0 6px 20px rgba(195, 226, 252, 0.55);
    z-index: 1;
    pointer-events: none;
  }

  .header-curved {
    position: relative;
    z-index: 2;
    width: 100%;
    height: clamp(240px, 36dvh, 310px);
    background-color: #10b981;
    border-bottom-left-radius: 50% 65px;
    border-bottom-right-radius: 50% 65px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 30px;
    text-align: center;
    color: #042f2c;
  }

  .logo-circle {
    width: clamp(84px, 14dvh, 110px);
    aspect-ratio: 1 / 1;
    background-color: #ffffff;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  .logo-circle img {
    width: 80%;
    height: 80%;
    object-fit: contain;
  }

  .header-curved h1,
  .header-curved p {
    font-size: clamp(17px, 5.2vw, 21px);
    font-weight: 700;
    color: #042f2c;
  }

  .header-curved h1 {
    margin-bottom: 8px;
  }

  /* ---------- فرم ---------- */
  .form-container {
    flex: 1; /* فضای باقی‌مانده را پر می‌کند */
    display: flex;
    flex-direction: column;
    padding: 15px 24px 25px;
    position: relative;
    z-index: 2;
  }

  .input-box {
    background: #ffffff;
    border: 1.5px solid #1f2937;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }

  .input-box:focus-within {
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  }

  .input-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1f2937;
    flex-shrink: 0;
  }

  .input-content {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
  }

  .input-content label {
    font-size: 13.5px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 3px;
  }

  .input-content input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px; /* زیر ۱۶px آیفون هنگام تایپ زوم می‌کند */
    color: #374151;
    width: 100%;
    padding: 0;
    text-align: right;
  }

  .input-content input::placeholder {
    color: #6b7280;
    font-size: 12.5px;
  }

  .forgot-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: -6px;
    margin-bottom: 24px;
    width: 100%;
  }

  .forgot-oval-halo,
  .footer-oval-halo {
    background: rgba(255, 255, 255, 0.52);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .forgot-oval-halo {
    width: 85%;
    max-width: 290px;
    height: 42px;
  }

  .forgot-oval-halo a {
    font-size: 14px;
    font-weight: 700;
    color: #111827;
    text-decoration: none;
  }

  .btn-login {
    width: 100%;
    height: 52px;
    background-color: #10b981;
    color: #042f2c;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(16, 185, 129, 0.35);
    transition:
      transform 0.15s ease,
      background-color 0.15s ease;
  }

  .btn-login:hover {
    background-color: #059669;
    color: #ffffff;
    transform: translateY(-2px);
  }

  .btn-login:active {
    transform: translateY(0);
  }

  /* فوتر همیشه ته صفحه می‌چسبد */
  .footer-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: auto;
    padding-top: 22px;
    width: 100%;
  }

  .footer-oval-halo {
    width: 90%;
    max-width: 325px;
    height: 44px;
    font-size: 14px;
    font-weight: 700;
    color: #111827;
  }

  .footer-oval-halo a {
    color: #065f46;
    text-decoration: none;
    margin-right: 5px;
  }
</style>

<div class="mobile-container">
  <div class="header-wrapper">
    <div class="header-curved">
      <div class="logo-circle">
        <img src="{% static 'images/logo.png' %}" alt="لوگو سلف" />
      </div>
      <h1>رزرو اتوماتیک غذای سلف</h1>
      <p>به اپلیکشن ما خوش آمدید</p>
    </div>
    <div class="header-halo-curve"></div>
  </div>

  <div class="form-container">
    <form method="POST">
      {% csrf_token %}

      <div class="input-box">
        <div class="input-icon">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="input-content">
          <label for="username">نام کاربری</label>
          <input
            id="username"
            type="text"
            name="username"
            placeholder="نام کاربری را وارد کنید"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="input-box">
        <div class="input-icon">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="input-content">
          <label for="password">رمز عبور</label>
          <input
            id="password"
            type="password"
            name="password"
            placeholder="رمز را وارد کنید"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <div class="forgot-container">
        <div class="forgot-oval-halo">
          <a href="{% url 'forgot-password' %}">رمز عبور را فراموش کرده اید؟</a>
        </div>
      </div>

      <button type="submit" class="btn-login">ورود</button>
    </form>

    <div class="footer-container">
      <div class="footer-oval-halo">
        حساب کاربری ندارید؟ <a href="{% url 'register' %}">ثبت نام کنید</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
