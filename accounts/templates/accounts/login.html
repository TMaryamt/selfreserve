{% extends 'accounts/base.html' %} {% load static %} {% block content %}
<style>
  @import url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css");

  * {
    box-sizing: border-box;
    font-family: "Vazirmatn", sans-serif;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  /* قاب گوشی موبایل با پس‌زمینه عکس دانشگاه */
  .mobile-container {
    width: 100%;
    max-width: 412px;
    min-height: 915px;
    position: relative;
    background: url("{% static 'images/campus.jpg' %}") center bottom/cover
      no-repeat;
    display: flex;
    flex-direction: column;
    direction: rtl;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
  }

  /* محفظه هدر */
  .header-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 28px;
  }

  /* لایه هاله سفید یکدست زیر بیضی */
  .header-halo-curve {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 335px;
    background-color: rgba(220, 238, 253, 0.92);
    border-bottom-left-radius: 50% 68px;
    border-bottom-right-radius: 50% 68px;
    box-shadow: 0 6px 20px rgba(195, 226, 252, 0.55);
    z-index: 1;
    pointer-events: none;
  }

  /* هدر اصلی سبز رنگ */
  .header-curved {
    background-color: #10b981;
    width: 100%;
    height: 310px;
    border-bottom-left-radius: 50% 65px;
    border-bottom-right-radius: 50% 65px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px 30px;
    text-align: center;
    color: #042f2c;
    position: relative;
    z-index: 2;
  }

  /* دایره سفید لوگو با پسوند jpg */
  .logo-circle {
    width: 110px;
    height: 110px;
    background-color: #ffffff;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  .logo-circle img {
    width: 80%;
    height: 80%;
    object-fit: contain;
  }

  .header-curved h1 {
    font-size: 21px;
    font-weight: 700;
    color: #042f2c;
    margin-bottom: 8px;
  }

  .header-curved p {
    font-size: 21px;
    font-weight: 700;
    color: #042f2c;
  }

  /* بخش فرم و فیلدهای ورودی */
  .form-container {
    padding: 15px 24px 25px;
    display: flex;
    flex-direction: column;
    z-index: 2;
  }

  /* کادر سفید ورودی */
  .input-box {
    background: #ffffff;
    border: 1.5px solid #1f2937;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }

  .input-box:focus-within {
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  }

  /* آیکون مشکی در سمت راست */
  .input-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1f2937;
    flex-shrink: 0;
  }

  .input-content {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .input-content label {
    font-size: 13.5px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 3px;
  }

  .input-content input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 13.5px;
    color: #374151;
    width: 100%;
    padding: 0;
    text-align: right;
  }

  .input-content input::placeholder {
    color: #6b7280;
    font-size: 12.5px;
  }

  /* لینک فراموشی رمز عبور وسط‌چین همراه با هاله بیضی */
  .forgot-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: -6px;
    margin-bottom: 24px;
    width: 100%;
  }

  .forgot-oval-halo {
    width: 85%;
    max-width: 290px;
    height: 42px;
    background: rgba(255, 255, 255, 0.52);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border-radius: 50%;
    display: flex;
    justify-content:center;
    align-items: center;
  }

  .forgot-oval-halo a {
    font-size: 14px;
    font-weight: 700;
    color: #111827;
    text-decoration: none;
  }

  /* دکمه ورود */
  .btn-login {
    width: 100%;
    height: 52px;
    background-color: #10b981;
    color: #042f2c;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(16, 185, 129, 0.35);
    transition:
      transform 0.15s ease,
      background-color 0.15s ease;
  }

  .btn-login:hover {
    background-color: #059669;
    color: #ffffff;
    transform: translateY(-2px);
  }

  .btn-login:active {
    transform: translateY(0);
  }

  /* هاله بیضی ملایم فوتر */
  .footer-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 22px;
    width: 100%;
  }

  .footer-oval-halo {
    width: 90%;
    max-width: 325px;
    height: 44px;
    background: rgba(255, 255, 255, 0.52);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 14.5px;
    font-weight: 700;
    color: #111827;
  }

  .footer-oval-halo a {
    color: #065f46;
    text-decoration: none;
    margin-right: 5px;
  }
</style>

<div class="mobile-container">
  <!-- هدر سبز همراه با هاله منحنی یکدست در زیر آن -->
  <div class="header-wrapper">
    <div class="header-curved">
      <div class="logo-circle">
        <img src="{% static 'images/logo.jpg' %}" alt="لوگو سلف" />
      </div>
      <h1>رزرو اتوماتیک غذای سلف</h1>
      <p>به اپلیکشن ما خوش آمدید</p>
    </div>

    <!-- هاله یکنواخت هلالی زیر بیضی -->
    <div class="header-halo-curve"></div>
  </div>

  <!-- فرم ورود -->
  <div class="form-container">
    <form method="POST">
      {% csrf_token %}

      <!-- فیلد نام کاربری -->
      <div class="input-box">
        <div class="input-icon">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="input-content">
          <label>نام کاربری</label>
          <input
            type="text"
            name="username"
            placeholder="نام کاربری را وارد کنید"
            required
          />
        </div>
      </div>

      <!-- فیلد رمز عبور -->
      <div class="input-box">
        <div class="input-icon">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="input-content">
          <label>رمز عبور</label>
          <input
            type="password"
            name="password"
            placeholder="رمز را وارد کنید"
            required
          />
        </div>
      </div>

      <!-- لینک فراموشی رمز عبور -->
      <div class="forgot-container">
        <div class="forgot-oval-halo">
          <a href="{% url 'forgot-password' %}">رمز عبور را فراموش کرده اید؟</a>
        </div>
      </div>

      <!-- دکمه ورود -->
      <button type="submit" class="btn-login">ورود</button>
    </form>

    <!-- فوتر با هاله بیضی شیشه‌ای -->
    <div class="footer-container">
      <div class="footer-oval-halo">
        حساب کاربری ندارید؟ <a href="{% url 'register' %}">ثبت نام کنید</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
